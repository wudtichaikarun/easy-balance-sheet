// Group quarters under one ticker; newest quarter first (build script already sorts).
const companies = [];
for (const d of DASHBOARDS) {
  let c = companies.find(x => x.ticker === d.ticker);
  if (!c) companies.push(c = {ticker: d.ticker, items: []});
  c.items.push(d);
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const narrow = matchMedia('(max-width:820px)');
let current = null;

// Theme: light ↔ dark. First visit follows the device; after that the choice is remembered per browser.
// The dashboard iframe is told too, so both always match.
let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
try { const saved = localStorage.getItem('ebs-theme'); if (saved === 'light' || saved === 'dark') theme = saved; } catch {}

function applyTheme() {
  document.documentElement.dataset.theme = theme;
  const next = theme === 'dark' ? 'light' : 'dark';
  for (const b of document.querySelectorAll('.theme')) {
    b.innerHTML = `<i class="ti ${next === 'dark' ? 'ti-moon' : 'ti-sun'}" aria-hidden="true"></i>`;
    b.title = b.ariaLabel = next === 'dark' ? 'เปลี่ยนเป็นธีมมืด' : 'เปลี่ยนเป็นธีมสว่าง';
  }
  $('frame').contentWindow?.postMessage({ebsTheme: theme}, '*');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.theme')) return;
  theme = theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('ebs-theme', theme); } catch {}
  applyTheme();
});
$('frame').addEventListener('load', applyTheme);
applyTheme();

$('count').textContent = `${companies.length} บริษัท`;

function render() {
  const term = $('q').value.trim().toLowerCase();
  const shown = companies.filter(c => !term || c.ticker.toLowerCase().includes(term) ||
    c.items.some(d => (d.about + ' ' + d.title).toLowerCase().includes(term)));
  $('list').innerHTML = shown.length ? shown.map(c => {
    const active = c.items.find(d => d.id === current) || c.items[0];
    const qs = c.items.length > 1 ? `<div class="qs">${c.items.map(d =>
      `<span class="q" role="button" tabindex="0" data-id="${d.id}" aria-pressed="${d.id === active.id}">${d.period}</span>`).join('')}</div>` : '';
    return `<button class="co" type="button" data-id="${active.id}" aria-current="${c.items.some(d => d.id === current)}">
      <div class="co-top"><span class="tk">${esc(c.ticker)}</span><span class="pd">${esc(active.period)}</span></div>
      ${active.about ? `<p class="ab">${esc(active.about)}</p>` : ''}
      ${active.headline ? `<p class="hl">${esc(active.headline)}</p>` : ''}${qs}</button>`;
  }).join('') : `<p class="empty">${companies.length ? 'ไม่พบหุ้นที่ค้นหา'
    : 'ยังไม่มี dashboard — ถ้านี่คือ index_template.html ให้เปิด output_html/index.html แทน หรือรัน <code>uv run build_index.py</code>'}</p>`;
}

function open(id, push = true) {
  const d = DASHBOARDS.find(x => x.id === id);
  if (!d) return;
  current = id;
  $('frame').hidden = false;
  $('welcome').hidden = true;
  if ($('frame').getAttribute('src') !== d.file) $('frame').setAttribute('src', d.file);
  $('barTitle').textContent = `${d.ticker} · ${d.period}`;
  $('openNew').href = d.file;
  document.title = `${d.ticker} ${d.period} · Easy Balance Sheet`;
  $('app').classList.add('open');
  if (push && location.hash !== '#' + id) history.pushState(null, '', '#' + id);
  render();
}

function home(push = true) {
  $('app').classList.remove('open');
  document.title = 'Easy Balance Sheet';
  if (push) history.pushState(null, '', location.pathname + location.search);
}

$('list').addEventListener('click', e => {
  const el = e.target.closest('[data-id]');
  if (el) { e.stopPropagation(); open(el.dataset.id); }
});
$('list').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('q')) { e.preventDefault(); open(e.target.dataset.id); }
});
$('q').addEventListener('input', render);
$('back').addEventListener('click', () => home());

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (DASHBOARDS.some(d => d.id === id)) open(id, false);
  else if (!narrow.matches && DASHBOARDS.length) open(companies[0].items[0].id, false);
  else { home(false); render(); }
}
addEventListener('popstate', route);
route();
</script>
